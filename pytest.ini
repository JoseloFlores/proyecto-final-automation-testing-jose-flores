[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --html=reports/reporte.html --self-contained-html

# Logging visible en consola y guardado en archivo
log_cli = true
log_cli_level = INFO
log_file = logs/ejecucion.log
log_file_level = INFO
log_file_format = %(asctime)s - %(levelname)s - %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
