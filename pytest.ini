[pytest]
testpaths = pruebas
python_files = prueba_*.py
python_functions = prueba_*
addopts = -v --html=reportes/reporte.html --self-contained-html

# Muestra los registros en consola y tambien los guarda en un archivo
log_cli = true
log_cli_level = INFO
log_file = registros/ejecucion.log
log_file_level = INFO
log_file_format = %(asctime)s - %(levelname)s - %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
